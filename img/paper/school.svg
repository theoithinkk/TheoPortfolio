<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
<defs>
  <filter id="lift" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx=".7" dy="1.3" stdDeviation=".55" flood-color="#1b130a" flood-opacity=".38"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".95" numOctaves="2" seed="7" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .12  0 0 0 0 .08  0 0 0 0 .03  .55 0 0 0 -.2" result="speck"/>
    <feComposite in="speck" in2="SourceAlpha" operator="in" result="fibre"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="fibre"/></feMerge>
  </filter>
</defs>
