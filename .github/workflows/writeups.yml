# Rebuilds the CTF writeup pages from theoithinkk/CTFwriteups and commits any changes.
# Only events listed in tools/writeup_events.json are built.
name: Sync CTF writeups

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"          # daily, 03:00 UTC
  repository_dispatch:
    types: [ctf-writeups-updated] # lets CTFwriteups trigger a rebuild on push later

permissions:
  contents: write

concurrency:
  group: writeups
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: theoithinkk/CTFwriteups
          path: _ctf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install pillow==12.0.0

      - run: python -I tools/build_writeups.py --all _ctf

      - name: Commit changes
        run: |
          git add writeups index.html
          if git diff --cached --quiet; then
            echo "Writeups already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync CTF writeups from CTFwriteups@$(git -C _ctf rev-parse --short HEAD)"
          git push
